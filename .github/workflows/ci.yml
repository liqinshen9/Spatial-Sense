name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Copy frontend build into backend wwwroot
        run: |
          rm -rf backend/wwwroot/assets backend/wwwroot/index.html backend/wwwroot/favicon.svg backend/wwwroot/icons.svg
          mkdir -p backend/wwwroot
          cp -R frontend/dist/* backend/wwwroot/

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore backend dependencies
        run: dotnet restore backend/Backend.csproj

      - name: Build backend
        run: dotnet build backend/Backend.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test backend.Tests/Backend.Tests.csproj --configuration Release --no-build

      - name: Publish backend
        run: dotnet publish backend/Backend.csproj --configuration Release --output publish

      - name: Deploy to Azure App Service
        if: github.event_name == 'push'
        uses: azure/webapps-deploy@v3
        with:
          app-name: spatial-sense-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
